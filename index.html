<script>
const P=[
{k:'cover'},
{t:'Selamat Datang',e:'Welcome',ic:'🌳',pts:[['🌏','Hutan dan lahan kita menjaga udara, air, dan kehidupan.','Our forests and lands protect air, water, and life.'],['🤝','Memahami Karhutla adalah langkah pertama untuk mencegahnya.','Understanding forest and land fires is the first step to preventing them.'],['👇','Geser halaman atau pilih dari daftar isi.','Flip the pages or choose from the contents.']],toc:1},
{t:'Apa Itu Karhutla?',e:'What Are Forest and Land Fires?',ic:'🔥',pts:[['🌲','Karhutla adalah kebakaran yang terjadi di hutan dan lahan, termasuk lahan gambut, dan meluas tak terkendali.','Karhutla are fires in forests and lands, including peatlands, that spread out of control.'],['📍','Di Indonesia sering terjadi pada musim kemarau, terutama di Sumatra dan Kalimantan.','In Indonesia they often occur in the dry season, especially in Sumatra and Kalimantan.']],more:['Karhutla adalah singkatan dari “kebakaran hutan dan lahan”.','Karhutla is short for “kebakaran hutan dan lahan” (forest and land fires).']},
{t:'Fakta Karhutla',e:'Karhutla Facts',ic:'📊',stats:[['2,61 juta ha','Area terbakar 2015 · Burned area 2015'],['1,65 juta ha','Area terbakar 2019 · Burned area 2019'],['1,16 juta ha','Area terbakar 2023 · Burned area 2023'],['Rp221 triliun','Perkiraan kerugian 2015 · Estimated 2015 loss (Bank Dunia/World Bank)']],src:'Sumber: SiPongi KLHK (luas area terbakar); Bank Dunia, 2016 (kerugian). Angka dapat diperbarui; cek sipongi.menlhk.go.id.',fact:['Hampir semua Karhutla dipicu ulah manusia, sengaja maupun lalai, menurut KLHK dan BNPB.','Almost all fires are triggered by human activity, intentional or negligent, according to KLHK and BNPB.']},
{t:'Penyebab Karhutla',e:'Causes of Fires',ic:'🚬',pts:[['☀️','Faktor alam: kemarau panjang dan El Niño membuat lahan kering.','Natural factors: long dry spells and El Niño dry out the land.'],['🧑‍🌾','Manusia: membuka lahan dengan membakar, membuang puntung rokok, api unggun atau sampah dibakar.','Humans: burning to clear land, discarded cigarette butts, campfires or burned waste.'],['🚜','Kanal yang menguras air gambut membuat lahan lebih rawan.','Canals that drain peat water make land more fire-prone.']],more:['UU 32/2009 Pasal 69 melarang membuka lahan dengan cara membakar; pengecualian terbatas untuk kearifan lokal (maks. 2 hektare, varietas lokal, dengan sekat bakar).','Law 32/2009 Art. 69 bans land clearing by burning, with limited local-wisdom exceptions (max. 2 hectares, local varieties, with firebreaks).']},
{t:'Bagaimana Karhutla Terjadi?',e:'How Do Fires Start?',ic:'🔺',pts:[['🌿','Bahan bakar: ranting, serasah, semak kering, gambut kering.','Fuel: twigs, litter, dry shrubs, dry peat.'],['💨','Oksigen: udara membuat api terus menyala.','Oxygen: air keeps the fire burning.'],['🔥','Sumber panas: api kecil dari kelalaian atau pembakaran sengaja.','Heat: a small flame from negligence or deliberate burning.'],['➡️','Kering + angin: api menjalar cepat ke area luas.','Dryness + wind: fire spreads quickly over wide areas.']],fact:['Hilangkan salah satu sisi “segitiga api” dan api padam.','Remove any side of the “fire triangle” and the fire goes out.']},
{t:'Mengenal Lahan Basah',e:'Getting to Know Wetlands',ic:'💧',pts:[['🏞️','Lahan basah adalah wilayah yang tergenang atau jenuh air, seperti rawa, gambut, mangrove, danau, dan sungai.','Wetlands are areas flooded or saturated with water, such as swamps, peat, mangroves, lakes, and rivers.'],['🧽','Fungsinya: menyimpan air, menahan banjir, dan menjadi rumah bagi banyak satwa.','Functions: storing water, reducing floods, and sheltering wildlife.'],['🏠','Di Kalimantan Selatan, lahan basah membentuk budaya, mulai dari rumah panggung hingga pasar terapung.','In South Kalimantan, wetlands shape culture, from stilt houses to floating markets.']],more:['Konvensi Ramsar (1971) adalah perjanjian internasional untuk perlindungan lahan basah; Indonesia menjadi pihak sejak 1991.','The Ramsar Convention (1971) is the international treaty for wetland protection; Indonesia has been a party since 1991.']},
{t:'Mengenal Lahan Gambut',e:'Getting to Know Peatlands',ic:'🟤',pts:[['🍂','Gambut terbentuk dari timbunan sisa tumbuhan yang terurai tidak sempurna selama ribuan tahun di kondisi jenuh air.','Peat forms from partly decomposed plant matter that piles up over thousands of years in waterlogged conditions.'],['🧽','Bekerja seperti spons: menyerap dan menyimpan air.','Works like a sponge: absorbs and stores water.'],['🌍','Menyimpan karbon dalam jumlah besar dan menjadi habitat orangutan, ikan, dan flora khas.','Stores large amounts of carbon and is home to orangutans, fish, and unique plants.']],fact:['Gambut yang terbakar melepas karbon yang tersimpan, memperparah perubahan iklim.','Burning peat releases stored carbon, worsening climate change.']},
{t:'Gambut & Karhutla',e:'Peat and Fire',ic:'♨️',pts:[['🚰','Kanal dan pembukaan lahan mengeringkan gambut.','Canals and land clearing drain the peat.'],['🏜️','Gambut kering tidak lagi menyerap air dan menjadi bahan bakar mudah terbakar.','Dry peat stops absorbing water and becomes easily burned fuel.'],['🕳️','Api merambat di bawah permukaan, sulit dipadamkan, dan menghasilkan asap pekat.','Fire smolders underground, is hard to put out, and makes thick smoke.']],more:['PP 57/2016 menetapkan tinggi muka air tanah gambut maksimal 0,4 meter di bawah permukaan; lebih dari itu dianggap rusak.','Government Reg. 57/2016 sets peat groundwater level at no more than 0.4 m below the surface; deeper counts as damaged.']},
{t:'Dampak terhadap Lingkungan',e:'Environmental Impact',ic:'🦧',pts:[['🌳','Hutan dan keanekaragaman hayati rusak.','Forests and biodiversity are damaged.'],['🐾','Satwa kehilangan habitat dan makanan.','Wildlife loses habitat and food.'],['☁️','Asap dan gas rumah kaca mencemari udara.','Smoke and greenhouse gases pollute the air.'],['🌱','Tanah rusak dan pemulihan memakan waktu lama.','Soil is damaged and recovery takes a long time.']]},
{t:'Dampak terhadap Kesehatan',e:'Health Impact',ic:'😷',pts:[['🫁','Partikel halus (PM2.5) dalam asap dapat masuk jauh ke paru-paru.','Fine particles (PM2.5) in smoke can reach deep into the lungs.'],['🤧','Gejala: batuk, mata perih, sesak, dan ISPA.','Symptoms: cough, sore eyes, breathlessness, and respiratory infections.'],['👶','Anak, lansia, ibu hamil, dan penderita asma paling rentan.','Children, elders, pregnant women, and people with asthma are most vulnerable.'],['😷','Gunakan masker N95/KN95, bukan masker kain biasa.','Use N95/KN95 masks, not ordinary cloth masks.']],more:['Kategori ISPU: 0–50 baik, 51–100 sedang, 101–200 tidak sehat, 201–300 sangat tidak sehat, 301+ berbahaya.','Air quality index (ISPU): 0–50 good, 51–100 moderate, 101–200 unhealthy, 201–300 very unhealthy, 301+ hazardous.']},
{t:'Dampak Sosial & Ekonomi',e:'Social & Economic Impact',ic:'🏫',pts:[['🏫','Sekolah bisa diliburkan saat kabut asap pekat.','Schools may close when smoke is thick.'],['✈️','Jarak pandang turun, penerbangan dan transportasi terganggu.','Visibility drops, disrupting flights and transport.'],['💼','Aktivitas warga dan usaha terhambat, biaya kesehatan naik.','Daily work and businesses are hampered, health costs rise.'],['🌏','Asap lintas batas dapat memengaruhi negara tetangga.','Transboundary haze can affect neighboring countries.']]},
{t:'Cara Mencegah Karhutla',e:'How to Prevent Fires',ic:'🚫',pts:[['🚭','Matikan dan buang puntung rokok dengan benar.','Put out and dispose of cigarette butts properly.'],['🗑️','Jangan membakar sampah atau lahan.','Never burn waste or land.'],['🚜','Buka lahan tanpa bakar.','Clear land without burning.'],['💧','Jaga kelembapan gambut dan dukung pembasahan kembali.','Keep peat wet and support rewetting.'],['📣','Laporkan titik api atau pembakaran ilegal.','Report fires or illegal burning.']],fact:['Mencegah jauh lebih murah dan lebih aman daripada memadamkan.','Prevention is far cheaper and safer than firefighting.']},
{t:'Peran Generasi Muda',e:'The Role of Youth',ic:'🧑‍🎓',pts:[['📚','Belajar dan bagikan informasi yang benar.','Learn and share accurate information.'],['📱','Buat kampanye kreatif di media sosial dan kampus.','Run creative campaigns on social media and campus.'],['🌱','Ikut relawan, tanam pohon, dan jaga lingkungan sekitar.','Volunteer, plant trees, and care for your surroundings.'],['🔎','Pantau kualitas udara dan peringatan dini dari BMKG dan SiPongi.','Follow air quality and early warnings from BMKG and SiPongi.']]},
{t:'Saat Terjadi Karhutla',e:'When a Fire Happens',ic:'🚨',pts:[['1️⃣','Jauhi lokasi api dan jangan coba memadamkan api besar sendirian.','Stay away and never try to fight a large fire alone.'],['2️⃣','Hubungi layanan darurat 112, BPBD, atau Manggala Agni setempat; sebutkan lokasi dengan jelas.','Call emergency 112, local BPBD, or Manggala Agni; state the location clearly.'],['3️⃣','Saat asap pekat: tetap di dalam ruangan, tutup jendela, pakai masker N95/KN95.','In thick smoke: stay indoors, close windows, wear an N95/KN95 mask.'],['4️⃣','Ikuti arahan petugas dan evakuasi bila diminta.','Follow officials and evacuate if told to.']],src:'Nomor dan lembaga dapat berbeda per daerah; pastikan kontak resmi di wilayah Anda.'},
{k:'myth'},{k:'quiz'},{k:'close'}];
const MY=[['“Karhutla hanya terjadi karena cuaca panas.”','Faktanya, kemarau memperbesar risiko, tetapi pemicu apinya hampir selalu manusia.','Dry weather raises risk, but people are almost always the ignition source.'],['“Membakar lahan adalah cara termurah dan aman.”','Faktanya, pembakaran dilarang (UU 32/2009) dan merugikan kesehatan serta ekonomi.','Burning is prohibited (Law 32/2009) and harms health and the economy.'],['“Kalau tidak tampak api, berarti sudah padam.”','Faktanya, api gambut bisa menyala di bawah tanah berhari-hari.','Peat fires can smolder underground for days.'],['“Masker kain cukup untuk asap.”','Faktanya, partikel halus lebih efektif disaring masker N95/KN95.','Fine particles are filtered better by N95/KN95 masks.']];
const Q=[['Apa pemicu utama Karhutla di Indonesia?','Petir saja','Aktivitas manusia',1,'Menurut KLHK dan BNPB, hampir semua Karhutla dipicu aktivitas manusia.'],['Mengapa gambut kering mudah terbakar?','Menjadi bahan bakar dan tak lagi menyerap air','Menjadi basah dan berlumpur',0,'Gambut kering menjadi bahan bakar yang bisa membara di bawah tanah.'],['Komponen “segitiga api” adalah…','Bahan bakar, oksigen, panas','Air, tanah, angin',0,'Api butuh bahan bakar, oksigen, dan sumber panas.'],['Masker yang disarankan saat kabut asap pekat?','Masker kain biasa','N95/KN95',1,'Masker N95/KN95 menyaring partikel halus PM2.5 lebih baik.'],['Apa yang dilakukan jika melihat api membesar?','Menghubungi 112/BPBD/Manggala Agni','Mencoba memadamkan sendiri',0,'Laporkan segera dan jauhi lokasi demi keselamatan.']];
const R=['Kementerian Lingkungan Hidup dan Kehutanan. SiPongi: Monitoring Karhutla (sipongi.menlhk.go.id).','Bank Dunia (2016). The Cost of Fire: An Economic Analysis of Indonesia’s 2015 Fire Crisis.','UU No. 32 Tahun 2009 tentang Perlindungan dan Pengelolaan Lingkungan Hidup, Pasal 69.','PP No. 57 Tahun 2016 (perubahan PP 71/2014) tentang Perlindungan dan Pengelolaan Ekosistem Gambut.','BMKG: informasi iklim, titik panas, dan kualitas udara (bmkg.go.id).','BNPB: informasi kebencanaan dan Karhutla (bnpb.go.id).','Konvensi Ramsar tentang Lahan Basah (ramsar.org).','Permen LHK tentang Indeks Standar Pencemar Udara (ISPU).'];
const rimba=(s=1)=>`<svg class="rimba" viewBox="0 0 120 150" width="${90*s}" aria-label="Rimba"><ellipse cx="60" cy="146" rx="30" ry="4" fill="#0003"/><rect x="40" y="88" width="40" height="42" rx="10" fill="#174D35"/><rect x="42" y="128" width="14" height="16" rx="4" fill="#0B3025"/><rect x="64" y="128" width="14" height="16" rx="4" fill="#0B3025"/><path d="M52 88l8 10 8-10z" fill="#F5F5EF"/><circle cx="60" cy="104" r="3" fill="#FFC857"/><g transform="rotate(8 90 107)"><rect x="74" y="92" width="34" height="30" rx="4" fill="#75513B"/><rect x="78" y="97" width="26" height="20" rx="2" fill="#F5F5EF"/><path d="M86 113q4-12 14-10-2 10-14 10z" fill="#2a7a52"/></g><circle cx="60" cy="62" r="22" fill="#F2C9A0"/><path d="M38 44q0-26 22-26t22 26z" fill="#174D35"/><rect x="38" y="37" width="44" height="6" fill="#FFC857"/><ellipse cx="60" cy="45" rx="36" ry="7" fill="#0B3025"/><circle cx="51" cy="62" r="3" fill="#23302a"/><circle cx="69" cy="62" r="3" fill="#23302a"/><path d="M51 71q9 9 18 0" stroke="#23302a" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="45" cy="69" r="3.5" fill="#F47B20" opacity=".35"/><circle cx="75" cy="69" r="3.5" fill="#F47B20" opacity=".35"/></svg>`;

const pine=(x,h,c)=>`<polygon points="${x},${150-h} ${x-h*.22},150 ${x+h*.22},150" fill="${c}"/>`;
const fire=(x,y=0)=>`<g transform="translate(${x},${y})"><path class="flame" d="M0 150q-14-22 0-48 4 14 14 20 8-6 0 28z" fill="#F47B20"/><path class="flame" d="M5 150q-6-12 0-26 8 10 6 26z" fill="#FFC857"/></g>`;
function scene(b){let t='',f='';for(let k=0;k<14;k++){const x=15+k*27,h=70+(k*37%40);t+=b?`<rect x="${x-2}" y="${150-h*.6}" width="4" height="${h*.6}" fill="#3a3330"/>`:`<g class="sway" style="animation-delay:${k%4*.3}s">${pine(x,h,k%2?'#174D35':'#2a7a52')}</g>`}if(b)for(let k=0;k<5;k++)f+=fire(40+k*70);const sm=b?[60,170,280].map((x,k)=>`<circle class="smoke" style="animation-delay:${k*2}s" cx="${x}" cy="80" r="26" fill="#A6AAA5"/>`).join(''):'<circle cx="340" cy="30" r="16" fill="#FFC857"/><text x="20" y="145" font-size="22">🦧</text>';return `<svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMax slice" width="100%" height="100%"><rect width="400" height="150" fill="${b?'#6b6560':'#cfe8d8'}"/>${sm}${t}${f}<rect y="146" width="400" height="4" fill="#75513B"/></svg>`}
const hs=(x,y,t)=>`<g class="hs" data-t="${t}"><circle cx="${x}" cy="${y}" r="11" fill="#F47B20"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">+</text></g>`;
function cut(d,h){const y=70+d*1.2,dry=d>40;let o=`<svg viewBox="0 0 360 230" width="100%"><rect width="360" height="70" fill="#cfe8d8"/><rect y="70" width="360" height="22" fill="#75513B"/><rect y="92" width="360" height="82" fill="#4a3225"/><rect y="174" width="360" height="56" fill="#A6AAA5"/><rect y="${y}" width="360" height="${230-y}" fill="#3b8fc7" opacity=".45"/><line x1="0" x2="360" y1="118" y2="118" stroke="#FFC857" stroke-dasharray="5 4"/><text x="6" y="114" font-size="10" fill="#FFC857">ambang 40 cm</text><g transform="translate(0,-80)">${pine(40,50,'#174D35')}${pine(110,60,'#2a7a52')}${pine(200,55,'#174D35')}</g>`;if(dry)o+=[60,150,240].map(x=>fire(x,-80)).join('');if(h)o+=hs(335,81,'<b>Tanah permukaan</b> tempat akar tumbuhan menempel.<i style=display:block;font-size:13px>Topsoil where plant roots hold.</i>')+hs(335,135,'<b>Lapisan gambut</b> menyimpan air dan karbon; jika kering mudah terbakar.<i style=display:block;font-size:13px>Peat layer stores water and carbon; burns easily when dry.</i>')+hs(335,200,'<b>Tanah mineral</b> di bawah gambut.<i style=display:block;font-size:13px>Mineral soil beneath the peat.</i>');return o+'</svg>'}
function cs(v){$('cs').innerHTML=cut(+v);$('dv').textContent=v;$('cm').innerHTML=v>40?'🔥 <b>Rawan terbakar!</b> Muka air lebih dalam dari 40 cm: gambut kering menjadi bahan bakar.<i style="display:block;font-size:13px">Water deeper than 40 cm: dry peat becomes fuel.</i>':'💧 <b>Aman.</b> Gambut tetap lembap seperti spons.<i style="display:block;font-size:13px">Peat stays moist like a sponge.</i>'}
const cyc=()=>`<svg viewBox="0 0 360 200" width="100%"><rect width="360" height="200" fill="#e8f3ee"/><circle cx="310" cy="30" r="18" fill="#FFC857"/><ellipse cx="110" cy="40" rx="42" ry="16" fill="#fff" stroke="#A6AAA5"/><ellipse cx="140" cy="34" rx="28" ry="14" fill="#fff" stroke="#A6AAA5"/><g class="rain" stroke="#3b8fc7" stroke-width="2"><path d="M95 62v14M115 62v14M135 58v14"/></g><path d="M0 150q90-20 180 0t180 0V200H0z" fill="#3b8fc7" opacity=".5"/><rect y="172" width="360" height="28" fill="#75513B"/><path d="M200 150v-30M215 150v-24M230 150v-34" stroke="#2a7a52" stroke-width="3"/><path d="M290 120q0-30 4-40M300 120q4-24 14-30" stroke="#FFC857" stroke-width="2" fill="none" stroke-dasharray="3 3"/>${hs(110,40,'<b>Hujan</b> mengisi kembali air di lahan basah.<i style=display:block;font-size:13px>Rain refills the water in wetlands.</i>')}${hs(215,160,'<b>Lahan basah</b> menyimpan air, sehingga tanah tetap lembap dan lebih sulit terbakar.<i style=display:block;font-size:13px>Wetlands store water, keeping soil moist and harder to burn.</i>')}${hs(310,30,'<b>Penguapan</b> mengembalikan air ke udara untuk menjadi awan.<i style=display:block;font-size:13px>Evaporation returns water to the air to form clouds.</i>')}</svg>`;
const hsb='<div class="box on" id="hsb">👆 Ketuk tanda + · Tap the + marks</div>';
const bi=(a,b)=>`<div class="fl" style="display:block">${a}<i style="font-size:12px;color:var(--mut)">${b}</i></div>`;
const MT=[['🌫️ Asap pekat','Thick smoke','🏫 Sekolah diliburkan','Schools close'],['👁️ Jarak pandang rendah','Low visibility','✈️ Penerbangan terganggu','Flights disrupted'],['😷 Partikel halus PM2.5','Fine particles','🏥 ISPA meningkat','More respiratory cases']];let ms=null;
function mt(s,k,b){if(s=='l'){ms=k;document.querySelectorAll('.ml').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}else if(ms!==null){if(ms==k){const l=document.querySelectorAll('.ml')[ms];l.classList.remove('sel');l.classList.add('ok');b.classList.add('ok');l.disabled=b.disabled=true}else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),600)}ms=null}}
function ART(n){switch(n){
case 0:return `<div class="scn" style="width:100%">${scene(1)}</div>`+say('Halo, aku Rimba dari kelompok Axiom Loka, penjaga hutan! Yuk, jelajahi bersamaku.','Hi, I’m Rimba, the forest ranger from the Axiom Loka group! Explore with me.');
case 1:return say('Yuk, kenali bahaya Karhutla sebelum terlambat!','Let’s understand the dangers of forest fires before it’s too late!',1.3);
case 2:return `<div class="two"><div><div class="scn">${scene(0)}</div><small>🌳 Hutan sehat · Healthy forest</small></div><div><div class="scn">${scene(1)}</div><small>🔥 Hutan terbakar · Burned forest</small></div></div>`;
case 3:return `<div class="grid">`+[['Titik panas = api?','Tidak selalu. Titik panas adalah indikator area bersuhu relatif tinggi dan perlu dicek di lapangan.','Hotspots indicate relatively hot areas and need field checks.'],['Gambut terbakar','Asap bisa sangat pekat dan lama karena api membara di bawah tanah.','Smoke can be thick and long-lasting because fire smolders underground.'],['Karbon','Karhutla gambut melepas karbon yang tersimpan ke udara.','Peat fires release stored carbon into the air.']].map(c=>`<button class="flip" onclick="this.classList.toggle('on')"><span class="f">🔄 ${c[0]}</span><span class="b">${c[1]}<i>${c[2]}</i></span></button>`).join('')+`</div>`;
case 4:return `<div class="two"><div class="cell" style="border-color:var(--yel)"><b>☀️ Alam · Nature</b><br>Kemarau panjang<br><i>Long dry spells</i><br>El Niño</div><div class="cell" style="border-color:var(--fire)"><b>🧑 Manusia · Humans</b><br>Membakar lahan<br><i>Burning land</i><br>Puntung rokok, sampah dibakar</div></div><p style="text-align:center;font-weight:bold;color:var(--fire);margin:8px 0 0">⬇ 🔥 Karhutla ⬇</p>`;
case 5:return `<div class="fl">`+[['🌿 Bahan bakar','Fuel'],['💨 Oksigen','Oxygen'],['🔥 Panas','Heat'],['🌬️ Kering + angin','Dry + wind'],['🌫️ Api & asap meluas','Fire & smoke spread']].map(s=>`<b>${s[0]}<i>${s[1]}</i></b>`).join('<span>→</span>')+`</div>`;
case 6:return cyc()+hsb;
case 7:return cut(20,1)+hsb;
case 8:return `<div id="cs"></div><label>Kedalaman muka air · Water depth: <b id="dv"></b> cm<input type="range" min="0" max="100" value="20" oninput="cs(this.value)"></label><div class="box on" id="cm"></div>`;
case 9:return `<div class="ba"><div class="scn">${scene(0)}</div><div class="scn ov" id="ov">${scene(1)}</div></div><input type="range" min="0" max="100" value="50" oninput="$('ov').style.clipPath='inset(0 0 0 '+this.value+'%)'" aria-label="Before after"><small style="color:var(--mut)">↔ Geser: sebelum & sesudah · Slide: before & after</small>`;
case 10:return `<div class="ispu">`+[['0–50','Baik · Good','#3a9d5d'],['51–100','Sedang · Moderate','#b8901f'],['101–200','Tidak sehat · Unhealthy','#F47B20'],['201–300','Sangat tidak sehat · Very unhealthy','#c0392b'],['301+','Berbahaya · Hazardous','#5a1f2a']].map(s=>`<div style="background:${s[2]}"><b>${s[0]}</b><br>${s[1]}</div>`).join('')+`</div>`+say('Pakai masker N95/KN95 saat asap pekat!','Wear an N95/KN95 mask when smoke is thick!',.8);
case 11:return `<b>Cocokkan penyebab dan dampaknya · Match cause and effect</b><div class="two"><div>`+MT.map((x,k)=>`<button class="ml" onclick="mt('l',${k},this)">${x[0]}<br><small>${x[1]}</small></button>`).join('')+`</div><div>`+[2,0,1].map(k=>`<button class="mr" onclick="mt('r',${k},this)">${MT[k][2]}<br><small>${MT[k][3]}</small></button>`).join('')+`</div></div>`;
case 12:return `<div class="tl">`+[['Kenali','Know'],['Cegah','Prevent'],['Basahi gambut','Rewet peat'],['Pantau','Monitor'],['Laporkan','Report']].map((s,k)=>`<div><em>${k+1}</em><b>${s[0]}</b><br><i>${s[1]}</i></div>`).join('')+`</div>`;
case 13:return say('Kamu bisa jadi pahlawan hutan: mulai dari berbagi informasi yang benar!','You can be a forest hero: start by sharing accurate information!',1.2);
case 14:return say('Tetap tenang, jauhi api, dan segera hubungi petugas.','Stay calm, keep away from the fire, and contact officials right away.',1.2);
case 17:return `<div class="scn" style="height:110px">${scene(0)}</div>`+say('Terima kasih sudah peduli. Sampai jumpa di hutan yang lestari! Salam, Rimba dari kelompok Axiom Loka.','Thank you for caring. See you in a thriving forest! Regards, Rimba from the Axiom Loka group.');}return ''}
function decor(){const a=ART(i);if(a){const h=m.querySelector('.hero');if(i==0)h.insertAdjacentHTML('beforeend',a);else h.insertAdjacentHTML('afterend',`<div class="art">${a}</div>`)}if(i==8)cs(20);ms=null;m.querySelectorAll('.hs').forEach(g=>g.onclick=()=>{$('hsb').innerHTML=g.dataset.t});m.querySelectorAll('.big').forEach(el=>{const x=el.textContent.match(/^([\d,]+)(.*)$/);if(!x)return;const dc=x[1].includes(',')?x[1].split(',')[1].length:0,v=parseFloat(x[1].replace(',','.'));let s=null;const f=t=>{s=s||t;const p=Math.min((t-s)/900,1);el.textContent=(v*p).toFixed(dc).replace('.',',')+x[2];if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
let i=0,sc=0,qi=0,ans=0;const $=id=>document.getElementById(id),m=$('m');
const tog=id=>$(id).classList.toggle('on');
const hero=(ic,t,e)=>`<div class="hero"><span class="ic">${ic}</span><div><h2>${t}</h2><em>${e}</em></div></div>`;
function home(){go(0)}
function go(n){i=Math.max(0,Math.min(P.length-1,n));$('toc').classList.remove('on');render();window.scrollTo(0,0)}
function more(el){el.nextElementSibling.classList.toggle('on')}
function render(){const p=P[i];let h='';
if(p.k=='cover')h=`<div class="pg cover"><div class="hero"><span class="ic">🌲🔥🌲</span><h1>MENGENAL KARHUTLA</h1><b>Lindungi Hutan, Jaga Masa Depan</b><em>UNDERSTANDING FOREST AND LAND FIRES: Protect Forests, Protect Our Future</em><p><button class="p" onclick="go(1)">Mulai Membaca · Start →</button></p></div></div>`;
else if(p.k=='myth')h=`<div class="pg">${hero('🧐','Myth vs Fact','Mitos vs Fakta')}<div class="body">`+MY.map((x,j)=>`<div class="cell" style="margin-bottom:10px"><b>${x[0]}</b><div class="row"><button onclick="this.parentNode.nextElementSibling.classList.add('on')">Lihat fakta · Reveal</button></div><div class="box"><b>Fakta:</b> ${x[1]}<i style="display:block;font-size:13px;color:var(--mut)">${x[2]}</i></div></div>`).join('')+`</div></div>`;
else if(p.k=='quiz')h=quiz();
else if(p.k=='close')h=`<div class="pg">${hero('🌱','Jaga Hutan, Jaga Masa Depan','Protect Forests, Protect Our Future')}<div class="body"><div class="pt"><span>💚</span><div><b>“Satu tindakan kecil hari ini, satu napas lega esok hari.”</b><i>“One small action today, one easier breath tomorrow.”</i></div></div><b>Referensi · References</b><ol class="src">${R.map(r=>`<li>${r}</li>`).join('')}</ol><div class="row"><button onclick="sc=0;qi=0;ans=0;go(16)">Ulangi Kuis · Retake Quiz</button><button class="p" onclick="home()">Kembali ke Awal · Back to start</button></div></div></div>`;
else{h=`<div class="pg">${hero(p.ic,p.t,p.e)}<div class="body">`;
if(p.pts)h+=p.pts.map(x=>`<div class="pt"><span>${x[0]}</span><div><b>${x[1]}</b><i>${x[2]}</i></div></div>`).join('');
if(p.stats)h+=`<div class="grid">`+p.stats.map(s=>`<div class="cell"><span class="big">${s[0]}</span><small>${s[1]}</small></div>`).join('')+`</div>`;
if(p.toc)h+=`<div class="grid">`+P.map((q,j)=>j>1?`<button class="cell" onclick="go(${j})">${j+1}. ${q.t||(q.k=='myth'?'Myth vs Fact':q.k=='quiz'?'Kuis':'Penutup')}</button>`:'').join('')+`</div>`;
if(p.more)h+=`<div class="row"><button onclick="more(this)">Learn More ＋</button></div><div class="box">${p.more[0]}<i style="display:block;font-size:13px;color:var(--mut)">${p.more[1]}</i></div>`;
if(p.fact)h+=`<div class="row"><button onclick="more(this)">💡 Fakta menarik · Fun fact</button></div><div class="box">${p.fact[0]}<i style="display:block;font-size:13px;color:var(--mut)">${p.fact[1]}</i></div>`;
if(p.src)h+=`<div class="src">${p.src}</div>`;h+=`</div></div>`}
m.innerHTML=h;decor();$('cnt').textContent=(i+1)+' / '+P.length;$('pr').style.width=((i+1)/P.length*100)+'%';$('pv').disabled=i==0;$('nx').disabled=i==P.length-1}
function quiz(){const hd=hero('🎯','Interactive Quiz','Kuis Interaktif');
if(qi>=Q.length)return `<div class="pg">${hd}<div class="body"><span class="big">${sc} / ${Q.length}</span><p>${sc>=4?'Hebat! Kamu siap jadi duta pencegah Karhutla.':'Bagus! Baca lagi halaman sebelumnya dan coba lagi.'}</p><i class="src">${sc>=4?'Great! You are ready to be a fire-prevention ambassador.':'Good effort! Revisit earlier pages and try again.'}</i><div class="row"><button class="p" onclick="sc=0;qi=0;ans=0;render()">Ulangi · Retry</button><button onclick="go(18)">Lanjut · Continue →</button></div></div></div>`;
const q=Q[qi];return `<div class="pg">${hd}<div class="body"><div class="src">Pertanyaan ${qi+1}/${Q.length} · Question ${qi+1}</div><b>${q[0]}</b>${[q[1],q[2]].map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${o}</button>`).join('')}<div class="box" id="fb"></div><div class="row"><button id="qn" class="p" style="display:none" onclick="qi++;ans=0;render()">Berikutnya · Next</button></div></div></div>`}
function pick(j,b){if(ans)return;ans=1;const q=Q[qi],ok=j==q[3];if(ok)sc++;b.classList.add(ok?'ok':'no');if(!ok)document.querySelectorAll('.opt')[q[3]].classList.add('ok');const f=$('fb');f.innerHTML=(ok?'✅ Benar! · Correct! ':'❌ Kurang tepat · Not quite. ')+q[4];f.classList.add('on');$('qn').style.display='inline-block'}
$('tl').innerHTML=P.map((q,j)=>`<button onclick="go(${j})">${j+1}. ${q.t||({cover:'Cover',myth:'Myth vs Fact',quiz:'Kuis · Quiz',close:'Penutup & Referensi'})[q.k]}</button>`).join('');
document.addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(i+1);if(e.key=='ArrowLeft')go(i-1)});
render();
</script></body></html>
